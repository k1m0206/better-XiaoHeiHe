<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Better XiaoHeiHe 设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings">
      <section class="panel">
        <div class="header">
          <div>
            <h1>Better XiaoHeiHe</h1>
            <p>帖子、评论、AI 总结和 AI Bot 设置</p>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="设置分类">
          <button class="tab is-active" type="button" role="tab" data-tab="feed" aria-selected="true">帖子</button>
          <button class="tab" type="button" role="tab" data-tab="comment" aria-selected="false">评论</button>
          <button class="tab" type="button" role="tab" data-tab="ai" aria-selected="false">AI 总结设置</button>
          <button class="tab" type="button" role="tab" data-tab="aibot" aria-selected="false">AI Bot</button>
        </div>

        <div id="panel-feed" class="tab-panel is-active" data-panel="feed">
          <div class="section">
            <div class="level-row">
              <div>
                <div class="section-title">等级过滤</div>
                <div class="section-desc" id="feedLevelValue">展示 Lv.7 及以上帖子</div>
              </div>
              <label class="switch" aria-label="开启帖子等级过滤">
                <input class="level-enabled" type="checkbox" data-scope="feed">
                <span></span>
              </label>
            </div>
            <input class="level-range" type="range" min="7" max="18" step="1" value="7" data-scope="feed">
          </div>

          <div class="section">
            <div class="section-title">屏蔽关键词</div>
            <div class="section-desc">匹配帖子标题、正文和分区/话题，命中后隐藏整条帖子。</div>
            <form class="keyword-form" data-scope="feed">
              <input class="keyword-input" type="text" placeholder="输入帖子关键词">
              <button class="keyword-add" type="submit">添加</button>
            </form>
            <div class="keyword-list" data-scope="feed"></div>
          </div>
        </div>

        <div id="panel-comment" class="tab-panel" data-panel="comment" hidden>
          <div class="section">
            <div class="level-row">
              <div>
                <div class="section-title">等级过滤</div>
                <div class="section-desc" id="commentLevelValue">展示 Lv.7 及以上评论</div>
              </div>
              <label class="switch" aria-label="开启评论等级过滤">
                <input class="level-enabled" type="checkbox" data-scope="comment">
                <span></span>
              </label>
            </div>
            <input class="level-range" type="range" min="7" max="18" step="1" value="7" data-scope="comment">
          </div>

          <div class="section">
            <div class="section-title">屏蔽关键词</div>
            <div class="section-desc">匹配评论内容，命中后隐藏对应评论。</div>
            <form class="keyword-form" data-scope="comment">
              <input class="keyword-input" type="text" placeholder="输入评论关键词">
              <button class="keyword-add" type="submit">添加</button>
            </form>
            <div class="keyword-list" data-scope="comment"></div>
          </div>
        </div>

        <div id="panel-ai" class="tab-panel" data-panel="ai" hidden>
          <div class="section ai-header">
            <div>
              <div class="section-title">AI 总结</div>
              <div class="section-desc">帖子和评论区摘要</div>
            </div>
            <div class="header-actions">
              <span id="enabledLabel" class="status-pill">未开启</span>
              <label class="switch" aria-label="开启 AI 总结">
                <input id="enabled" type="checkbox">
                <span></span>
              </label>
            </div>
          </div>

          <details class="section collapsible-section" open>
            <summary class="collapsible-summary">
              <span class="section-title">接入配置 <span class="connection-dot" data-connection-status="ai" title="接入状态：未测试"></span></span>
              <span class="collapsible-indicator" aria-hidden="true"></span>
            </summary>
            <label class="field">
              <span>服务商类型</span>
              <select id="provider">
                <option value="openai-compatible">OpenAI Compatible · Chat Completions</option>
                <option value="openai-responses">OpenAI · Responses</option>
                <option value="anthropic">Anthropic · Messages</option>
                <option value="gemini">Gemini · Generate Content</option>
              </select>
            </label>

            <label class="field">
              <span>Base URL</span>
              <input id="baseUrl" type="url" placeholder="https://api.openai.com/v1">
            </label>

            <label class="field">
              <span class="field-title">
                模型
                <button id="fetchModels" class="text-button" type="button">拉取模型</button>
              </span>
              <div class="model-combobox">
                <input id="model" list="modelOptions" type="text" placeholder="gpt-4.1-mini">
                <button id="modelDropdown" class="model-dropdown" type="button" aria-label="选择已拉取模型" aria-expanded="false" disabled></button>
                <div id="modelMenu" class="model-menu" role="listbox" hidden></div>
              </div>
              <datalist id="modelOptions"></datalist>
            </label>

            <label class="field">
              <span>API Key</span>
              <div class="secret-input">
                <input id="apiKey" type="password" autocomplete="off" placeholder="sk-...">
                <button class="secret-toggle" type="button" data-secret-toggle="apiKey" aria-label="显示 API Key" aria-pressed="false">显示</button>
              </div>
            </label>
            <div class="collapsible-actions">
              <button id="test" type="button">测试连通</button>
              <span id="status" role="status"></span>
            </div>
          </details>

          <div class="section">
            <label class="field field--prompt">
              <span class="field-title">
                总结提示词
                <button id="resetPrompt" class="text-button" type="button">恢复默认</button>
              </span>
              <textarea id="summaryPrompt" rows="6"></textarea>
            </label>
          </div>

        </div>

        <div id="panel-aibot" class="tab-panel" data-panel="aibot" hidden>
          <div class="section ai-header">
            <div>
              <div class="section-title">AI Bot</div>
              <div class="section-desc">自动回复 @、评论和回复消息</div>
            </div>
          </div>

          <details class="section collapsible-section" open>
            <summary class="collapsible-summary">
              <span class="section-title">接入配置 <span class="connection-dot" data-connection-status="aiBot" title="接入状态：未测试"></span></span>
              <span class="collapsible-indicator" aria-hidden="true"></span>
            </summary>
            <label class="field">
              <span>服务商类型</span>
              <select id="aiBotProvider">
                <option value="openai-compatible">OpenAI Compatible · Chat Completions</option>
                <option value="openai-responses">OpenAI · Responses</option>
                <option value="anthropic">Anthropic · Messages</option>
                <option value="gemini">Gemini · Generate Content</option>
              </select>
            </label>

            <label class="field">
              <span>Base URL</span>
              <input id="aiBotBaseUrl" type="url" placeholder="https://api.openai.com/v1">
            </label>

            <label class="field">
              <span class="field-title">
                模型
                <button id="aiBotFetchModels" class="text-button" type="button">拉取模型</button>
              </span>
              <div class="model-combobox">
                <input id="aiBotModel" list="aiBotModelOptions" type="text" placeholder="gpt-4.1-mini">
                <button id="aiBotModelDropdown" class="model-dropdown" type="button" aria-label="选择已拉取模型" aria-expanded="false" disabled></button>
                <div id="aiBotModelMenu" class="model-menu" role="listbox" hidden></div>
              </div>
              <datalist id="aiBotModelOptions"></datalist>
            </label>

            <label class="field">
              <span>API Key</span>
              <div class="secret-input">
                <input id="aiBotApiKey" type="password" autocomplete="off" placeholder="sk-...">
                <button class="secret-toggle" type="button" data-secret-toggle="aiBotApiKey" aria-label="显示 API Key" aria-pressed="false">显示</button>
              </div>
            </label>
            <div class="collapsible-actions">
              <button id="aiBotTest" type="button">测试连通</button>
              <span id="aiBotStatus" role="status"></span>
            </div>
          </details>

          <div class="section">
            <div class="section-title">运行规则</div>
            <div class="compact-number-grid">
              <label class="field field--compact-number">
                <span>轮询评论和@周期（分钟）</span>
                <input id="aiBotPollMinutes" type="number" min="1" step="1" value="1">
              </label>

              <label class="field field--compact-number">
                <span>只处理最近消息（分钟）</span>
                <input id="aiBotMessageFreshMinutes" type="number" min="1" step="1" value="5">
              </label>
            </div>

            <label class="rule-toggle">
              <input id="aiBotReplyMentions" type="checkbox" checked>
              <span class="rule-toggle__switch" aria-hidden="true"></span>
              <span class="rule-toggle__text">回复 @ 我的消息</span>
            </label>

            <label class="rule-toggle">
              <input id="aiBotReplyComments" type="checkbox">
              <span class="rule-toggle__switch" aria-hidden="true"></span>
              <span class="rule-toggle__text">回复评论 / 回复我的消息</span>
            </label>

            <label class="field field--prompt">
              <span>白名单用户 ID</span>
              <textarea id="aiBotWhitelist" rows="4" placeholder="空白表示允许回复所有触发用户；多个 ID 可用逗号、空格或换行分隔"></textarea>
            </label>

            <label class="field field--prompt">
              <span class="field-title">
                AI 评论提示词
                <button id="aiBotResetPrompt" class="text-button" type="button">恢复默认</button>
              </span>
              <textarea id="aiBotCommentPrompt" rows="6"></textarea>
            </label>
          </div>

          <div class="actions">
            <button id="aiBotRunNow" type="button">立即轮询</button>
            <button id="aiBotViewLogs" type="button">查看运行日志</button>
          </div>
        </div>

        <div id="panel-aibot-logs" class="tab-panel" data-panel="aibot-logs" hidden>
          <div class="section">
            <div class="field-title log-title">
              <span class="section-title">AI Bot 运行日志</span>
              <span>
                <button id="aiBotBackSettings" class="text-button" type="button">返回设置</button>
                <button id="aiBotClearLogs" class="text-button" type="button">清空日志</button>
              </span>
            </div>
            <div class="section-desc">进入本界面时会读取最新日志；日志仅保存在当前浏览器本地。</div>
            <div class="log-switch" role="tablist" aria-label="AI Bot 日志类型">
              <button class="log-switch-button is-active" type="button" data-ai-bot-log-view="runtime" role="tab" aria-selected="true">运行日志</button>
              <button class="log-switch-button" type="button" data-ai-bot-log-view="message" role="tab" aria-selected="false">消息日志</button>
              <button class="log-switch-button" type="button" data-ai-bot-log-view="pending" role="tab" aria-selected="false">待处理消息</button>
            </div>
            <div id="aiBotLogs" class="log-list" data-ai-bot-log-panel="runtime"></div>
            <div id="aiBotMessageLogs" class="message-log-list" data-ai-bot-log-panel="message" hidden></div>
            <div id="aiBotPendingMessages" class="message-log-list" data-ai-bot-log-panel="pending" hidden></div>
            <div class="actions actions--log">
              <button id="aiBotRefreshLogs" type="button">刷新日志</button>
              <span id="aiBotLogStatus" role="status"></span>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
